<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category & Location Selector</title>
  <style>
    .filter-container {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="filter-container">
  <h2>ক্যাটাগরি ও লোকেশন ফিল্টার</h2>

  <!-- Category Selection -->
  <div class="form-group">
    <label for="main-category">মূল ক্যাটাগরি:</label>
    <select id="main-category" onchange="updateSubCategories()">
      <option value="">ক্যাটাগরি নির্বাচন করুন</option>
      <option value="mobiles">মোবাইল (Mobiles)</option>
      <option value="electronics">ইলেকট্রনিক্স (Electronics)</option>
      <option value="vehicles">যানবাহন (Vehicles)</option>
      <option value="property">প্রোপার্টি (Property)</option>
      <option value="home">হোম ও লিভিং (Home & Living)</option>
      <option value="pets">পোষা প্রাণী ও পাখি (Pets & Animals)</option>
      <option value="fashion">ফ্যাশন ও লাইফস্টাইল (Fashion)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="sub-category">সাব-ক্যাটাগরি:</label>
    <select id="sub-category">
      <option value="">প্রথমে মূল ক্যাটাগরি নির্বাচন করুন</option>
    </select>
  </div>

  <hr>

  <!-- Location Selection -->
  <div class="form-group">
    <label for="division">বিভাগ:</label>
    <select id="division" onchange="updateDistricts()">
      <option value="">বিভাগ নির্বাচন করুন</option>
      <option value="ctg">চট্টগ্রাম বিভাগ</option>
      <option value="dhaka">ঢাকা বিভাগ</option>
      <option value="rajshahi">রাজশাহী বিভাগ</option>
      <option value="khulna">খুলনা বিভাগ</option>
      <option value="sylhet">সিলেট বিভাগ</option>
      <option value="barishal">বরিশাল বিভাগ</option>
      <option value="rangpur">রংপুর বিভাগ</option>
      <option value="mymensingh">ময়মনসিংহ বিভাগ</option>
    </select>
  </div>

  <div class="form-group">
    <label for="district">জেলা:</label>
    <select id="district" onchange="updateThanas()">
      <option value="">প্রথমে বিভাগ নির্বাচন করুন</option>
    </select>
  </div>

  <div class="form-group">
    <label for="thana">থানা / এলাকা:</label>
    <select id="thana">
      <option value="">প্রথমে জেলা নির্বাচন করুন</option>
    </select>
  </div>
</div>

<script>
  // Category Data
  const subCategories = {
    mobiles: ["মোবাইল ফোন", "মোবাইল এক্সেসরিজ", "স্মার্টওয়াচ ও ওয়্যারএবলস", "সিম কার্ড"],
    electronics: ["ডেস্কটপ ও ল্যাপটপ", "কম্পিউটার এক্সেসরিজ", "টিভি ও ভিডিও অ্যাপ্লায়েন্স", "অডিও ও মিউজিক", "ক্যামেরা ও সিকিউরিটি", "হোম অ্যাপ্লায়েন্স"],
    vehicles: ["প্রাইভেট কার", "মোটর বাইক ও স্কুটার", "বাইসাইকেল", "অটো রিকশা ও থ্রি-হুইলার", "ট্রাক ও বাণিজ্যিক গাড়ি", "স্পেয়ার পার্টস"],
    property: ["ফ্ল্যাট/বাসা বিক্রয়", "ফ্ল্যাট/বাসা ভাড়া", "জমি ও প্লট", "কমার্শিয়াল প্রোপার্টি", "রুম ভাড়া"],
    home: ["ফার্নিচার", "হোম ডেকোর ও আলো", "গৃহস্থালি সামগ্রী", "বাগান ও অন্যান্য"],
    pets: ["বিড়াল ও কিটেন", "পাখি", "মাছ ও অ্যাকোয়ারিয়াম", "কুকুর ও পাপিস", "পেট ফুড ও এক্সেসরিজ"],
    fashion: ["পোশাক ও জুতা", "ঘড়ি ও এক্সেসরিজ", "হেলথ ও বিউটি"]
  };

  // Location Data
  const districts = {
    ctg: ["চট্টগ্রাম জেলা", "কক্সবাজার", "কুমিল্লা", "ফেনী", "নোয়াখালী", "লক্ষ্মীপুর", "চাঁদপুর", "ব্রাহ্মণবাড়িয়া", "রাঙ্গামাটি", "বান্দরবান", "খাগড়াছড়ি"],
    dhaka: ["ঢাকা জেলা", "গাজীপুর", "নারায়ণগঞ্জ", "টাঙ্গাইল", "নরসিংদী", "ফরিদপুর", "মানিকগঞ্জ", "মুন্সীগঞ্জ", "রাজবাড়ী", "গোপালগঞ্জ", "মাদারীপুর", "শরীয়তপুর", "কিশোরগঞ্জ"],
    rajshahi: ["রাজশাহী", "বগুড়া", "পাবনা", "সিরাজগঞ্জ", "নওগাঁ", "নাটোর", "চাঁপাইনবাবগঞ্জ", "জয়পুরহাট"],
    khulna: ["খুলনা", "যশোর", "কুষ্টিয়া", "সাতক্ষীরা", "বাগেরহাট", "ঝিনাইদহ", "চুয়াডাঙ্গা", "মেহেরপুর", "নড়াইল", "মাগুরা"],
    sylhet: ["সিলেট", "মৌলভীবাজার", "হবিগঞ্জ", "সুনামগঞ্জ"],
    barishal: ["বরিশাল", "পটুয়াখালী", "ভোলা", "পিরোজপুর", "বরগুনা", "ঝালকাঠি"],
    rangpur: ["রংপুর", "দিনাজপুর", "গাইবান্ধা", "কুড়িগ্রাম", "নীলফামারী", "পঞ্চগড়", "ঠাকুরগাঁও", "লালমনিরহাট"],
    mymensingh: ["ময়মনসিংহ", "জামালপুর", "নেত্রকোণা", "শেরপুর"]
  };

  const thanas = {
    "চট্টগ্রাম জেলা": ["চট্টগ্রাম ইপিজেড", "পতেঙ্গা", "হালিশহর", "কোতোয়ালি", "পঞ্চলাইশ", "ডবলমুরিং", "পাহাড়তলী", "বায়েজিদ বোস্তামী", "খুলশী", "আগ্রাবাদ", "জিইসি", "চান্দগাঁও", "চকবাজার", "বন্দর", "আকবর শাহ", "হাটহাজারী", "রাউজান", "ফটিকছড়ি", "পটিয়া", "সীতাকুণ্ড", "মিরসরাই", "আনোয়ারা", "বোয়ালখালী"],
    "ঢাকা জেলা": ["মিরপুর", "উত্তরা", "ধানমন্ডি", "গুলশান", "বনানী", "মোহাম্মদপুর", "বাড্ডা", "রামপুরা", "যাত্রাবাড়ী", "খিলগাঁও", "বাসাবো", "তেজগাঁও", "মতিঝিল", "মগবাজার", "লালবাগ", "নিউ মার্কেট", "শাহবাগ", "সাভার", "কেরানীগঞ্জ", "ধামরাই"]
  };

  function updateSubCategories() {
    const main = document.getElementById("main-category").value;
    const subSelect = document.getElementById("sub-category");
    subSelect.innerHTML = '<option value="">সাব-ক্যাটাগরি নির্বাচন করুন</option>';
    
    if (subCategories[main]) {
      subCategories[main].forEach(sub => {
        subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
    }
  }

  function updateDistricts() {
    const div = document.getElementById("division").value;
    const distSelect = document.getElementById("district");
    const thanaSelect = document.getElementById("thana");
    distSelect.innerHTML = '<option value="">জেলা নির্বাচন করুন</option>';
    thanaSelect.innerHTML = '<option value="">প্রথমে জেলা নির্বাচন করুন</option>';

    if (districts[div]) {
      districts[div].forEach(dist => {
        distSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
      });
    }
  }

  function updateThanas() {
    const dist = document.getElementById("district").value;
    const thanaSelect = document.getElementById("thana");
    thanaSelect.innerHTML = '<option value="">থানা / এলাকা নির্বাচন করুন</option>';

    if (thanas[dist]) {
      thanas[dist].forEach(thana => {
        thanaSelect.innerHTML += `<option value="${thana}">${thana}</option>`;
      });
    } else {
      thanaSelect.innerHTML = '<option value="all">সমগ্র জেলা</option>';
    }
  }
</script>

</body>
</html>
