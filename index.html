<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza | কেনা-বেচার সহজ মাধ্যম</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; }
        
        /* Navigation Bar */
        .navbar { background-color: #008069; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 28px; font-weight: bold; text-decoration: none; }
        .logo span { color: #ffce00; }
        .nav-btns .btn-post { background-color: #ffce00; color: #333; padding: 10px 18px; font-weight: bold; border-radius: 20px; text-decoration: none; }
        
        /* Hero Header Section */
        .hero { background: linear-gradient(rgba(0,128,105,0.8), rgba(0,128,105,0.8)), url('https://via.placeholder.com/1200x400'); background-size: cover; color: white; text-align: center; padding: 60px 20px; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { font-size: 18px; margin-bottom: 25px; opacity: 0.9; }
        
        /* Search Bar Box */
        .search-box { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 14px; border: none; border-radius: 6px; font-size: 16px; outline: none; }
        .search-box button { background-color: #ffce00; border: none; padding: 14px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<!-- Top Navigation -->
<nav class="navbar">
    <a href="#" class="logo">Baza<span>.com.bd</span></a>
    <div class="nav-btns">
        <a href="#" class="btn-post">+ বিজ্ঞাপন দিন</a>
    </div>
</nav>

<!-- Hero Section -->
<header class="hero">
    <h1>Baza-তে সবকিছু কেনা-বেচা করুন সহজে</h1>
    <p>আপনার ব্যবহৃত বা নতুন পণ্য কেনা-বেচার সবচেয়ে নিরাপদ প্ল্যাটফর্ম</p>
    
    <div class="search-box">
        <input type="text" placeholder="কী খুঁজছেন? (যেমন: মোবাইল, বাইক, ফ্রিজ)...">
        <button>খুঁজুন</button>
    </div>
</header>

</body>
</html>
