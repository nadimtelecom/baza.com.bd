<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="enFUE9G2pbJwvJOqPqd8q-nIOkAh3nsFH4zTGwR_95Y" />
    <title>Baza.com.bd - Marketplace Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Header */
        header {
            background-color: #008069;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 24px;
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-box button {
            padding: 12px 25px;
            background-color: #008069;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .search-box button:hover {
            background-color: #006654;
        }

        /* Section Title */
        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #008069;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .card-body h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .card-body .price {
            color: #008069;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card-body button {
            width: 100%;
            padding: 8px;
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .card-body button:hover {
            background-color: #e68a00;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Baza.com.bd</h1>
        <span>অনলাইন মার্কেটপ্লেস</span>
    </header>

    <div class="container">
        <!-- Search -->
        <div class="search-box">
            <input type="text" placeholder="পণ্য বা অ্যাক্সেসরিজ খুঁজুন...">
            <button>সার্চ</button>
        </div>

        <!-- Featured Products -->
        <h2 class="section-title">সর্বশেষ পণ্যসমূহ</h2>
        
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <div class="card-body">
                    <h3>মোবাইল ফোন ও অ্যাক্সেসরিজ</h3>
                    <div class="price">৳ ১,৫০০</div>
                    <button>বিস্তারিত দেখুন</button>
                </div>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <div class="card-body">
                    <h3>ওয়্যারলেস ইয়ারবাডস</h3>
                    <div class="price">৳ ১,২০০</div>
                    <button>বিস্তারিত দেখুন</button>
                </div>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <div class="card-body">
                    <h3>ওয়াইফাই রাউটার</h3>
                    <div class="price">৳ ২,৮০০</div>
                    <button>বিস্তারিত দেখুন</button>
                </div>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <div class="card-body">
                    <h3>স্মার্টওয়াচ</h3>
                    <div class="price">৳ ২,১০০</div>
                    <button>বিস্তারিত দেখুন</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Baza.com.bd - সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

</body>
</html>
