<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza.com.bd - ক্রয় ও বিক্রয় করুন সহজে</title>
    <style>
        :root {
            --primary: #00838f;
            --primary-dark: #005662;
            --bg-light: #f4f6f8;
            --text-light: #333;
            --card-bg-light: #fff;
            --bg-dark: #121212;
            --text-dark: #f1f1f1;
            --card-bg-dark: #1e1e1e;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
            padding-bottom: 70px;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Header & Search Bar */
        header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .search-box {
            flex-grow: 1;
            max-width: 500px;
            display: flex;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .search-box button {
            padding: 10px 15px;
            background: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Container & Cards Layout */
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg-light);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        body.dark-mode .card {
            background-color: var(--card-bg-dark);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }

        .card-price {
            color: var(--primary);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-location {
            font-size: 12px;
            color: #777;
        }

        /* Modal for Details */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        body.dark-mode .modal-content {
            background: var(--card-bg-dark);
            color: white;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Mobile Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--primary);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .nav-item {
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .bottom-nav {
                display: none;
            }
            body {
                padding-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">Baza.com.bd</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="যা খুঁজছেন লিখুন (যেমন: মোবাইল, বাইক)..." onkeyup="filterAds()">
                <button>সার্চ</button>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">ডার্ক/লাইট</button>
        </div>
    </header>

    <div class="container">
        <h2>সাম্প্রতিক বিজ্ঞাপনসমূহ</h2>
        <div class="grid" id="adsGrid">
            <!-- Dynamic Content Load হবে -->
        </div>
    </div>

    <!-- Product Details Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" style="width:100%; height:200px; object-fit:cover; border-radius:5px;" alt="Product">
            <h3 id="modalTitle"></h3>
            <p id="modalPrice" style="color:var(--primary); font-weight:bold; font-size:20px;"></p>
            <p id="modalLocation" style="color:#777;"></p>
            <p id="modalDesc"></p>
            <button style="width:100%; padding:10px; background:green; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="alert('বিক্রেতার মোবাইল নম্বর: ০১৭XXXXXXXX')">কল করুন</button>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">হোম</a>
        <a href="#" class="nav-item">ক্যাটাগরি</a>
        <a href="#" class="nav-item" onclick="alert('পোস্ট করার ফিচার যোগ করা হচ্ছে')">+ পোস্ট</a>
        <a href="#" class="nav-item">অ্যাকাউন্ট</a>
    </nav>

    <script>
        // Sample Data
        const sampleAds = [
            { id: 1, title: 'Redmi Note 13 Pro 5G', price: '২৪,০০০ টাকা', location: 'চট্টগ্রাম', desc: 'একদম নতুন কন্ডিশন, সাথে বক্স ও চার্জার আছে।', img: 'https://via.placeholder.com/300x200' },
            { id: 2, title: 'Duranta Bicycle 24 inch', price: '৬,৫০৮ টাকা', location: 'ঢাকা', desc: 'কম ব্যবহৃত সাইকেল, কোনো সমস্যা নেই।', img: 'https://via.placeholder.com/300x200' },
            { id: 3, title: 'Walton Refrigerator 217L', price: '৩২,৫০০ টাকা', location: 'চট্টগ্রাম', desc: 'নো-ফ্রস্ট ফ্রিজ, ২ বছর সার্ভিস ওয়ারেন্টি আছে।', img: 'https://via.placeholder.com/300x200' }
        ];

        // Load Ads
        function renderAds(ads) {
            const grid = document.getElementById('adsGrid');
            grid.innerHTML = '';
            ads.forEach(ad => {
                grid.innerHTML += `
                    <div class="card" onclick="openModal(${ad.id})">
                        <img src="${ad.img}" alt="${ad.title}">
                        <div class="card-content">
                            <div class="card-title">${ad.title}</div>
                            <div class="card-price">${ad.price}</div>
                            <div class="card-location">${ad.location}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Search Filter
        function filterAds() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = sampleAds.filter(ad => ad.title.toLowerCase().includes(query) || ad.location.toLowerCase().includes(query));
            renderAds(filtered);
        }

        // Modal Controls
        function openModal(id) {
            const ad = sampleAds.find(a => a.id === id);
            if(ad) {
                document.getElementById('modalTitle').innerText = ad.title;
                document.getElementById('modalPrice').innerText = ad.price;
                document.getElementById('modalLocation').innerText = 'লোকেশন: ' + ad.location;
                document.getElementById('modalDesc').innerText = ad.desc;
                document.getElementById('modalImg').src = ad.img;
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        // Dark/Light Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // Initial Load
        renderAds(sampleAds);
    </script>
</body>
</html>
